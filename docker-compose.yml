version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: mcp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - mcp_network

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mcp_app
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp_network

  celery-worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mcp_celery_worker
    command: celery -A app.workers.celery_app worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp_network

  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: mcp_celery_beat
    command: celery -A app.workers.celery_app beat --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - mcp_network

volumes:
  redis_data:

networks:
  mcp_network:
    driver: bridge